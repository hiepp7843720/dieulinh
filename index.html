<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bó hoa dành cho bạn 🌸</title>
<style>
:root{--pink:#f4a9b8;--rose:#d8758c;--cream:#fff4ee;--ink:#2b2226;--bg:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--cream);font-family:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden}
#stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#ffe9b8;box-shadow:0 0 8px 2px rgba(255,233,184,.6);animation:tw var(--d,3s) ease-in-out infinite;opacity:.2}
@keyframes tw{50%{opacity:.95;transform:scale(1.6)}}
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.bouquet{position:relative;width:min(94vw,560px,calc((100vh - 90px)*1.231));aspect-ratio:831/675;cursor:pointer;animation:float 5s ease-in-out infinite}
.bouquet.open{cursor:default}
@keyframes float{50%{transform:translateY(-8px)}}
.bouquet>img.base{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.photo{position:absolute;width:25%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0;border:0;padding:0;background:none;cursor:pointer;transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .4s;transition-delay:calc(var(--i)*90ms)}
.open .photo{transform:translate(-50%,-50%) scale(1) rotate(var(--r,0deg));opacity:1}
.open .photo:hover{transform:translate(-50%,-50%) scale(1.1) rotate(0);transition-delay:0s;z-index:5}
.photo .ph{width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#f9cdd6,#fff0e8);display:grid;place-items:center;color:var(--rose);font-size:12px;text-align:center;box-shadow:0 0 0 3px rgba(255,236,230,.9),0 6px 22px rgba(244,169,184,.55)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.hint{margin:14px 0 0;font-size:15px;letter-spacing:.02em;color:#ffd9e0;text-align:center;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* ---------- Instagram-style viewer ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);padding:12px}
.overlay.show{display:flex}
.post{width:min(94vw,430px);max-height:96vh;overflow:auto;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 20px 60px rgba(244,169,184,.25);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.post header{display:flex;align-items:center;gap:10px;padding:10px 12px}
.avatar{width:34px;height:34px;border-radius:50%;padding:2px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.avatar span{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #fff;background:#f9cdd6 center/cover}
.who{font-weight:600;font-size:14px;line-height:1.2}.who small{display:block;font-weight:400;color:#8a7d82;font-size:11px}
.close{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:#555;padding:4px 8px}
.pic{aspect-ratio:1;background:#f6e3e8 center/cover;display:grid;place-items:center;color:var(--rose);font-size:14px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.bar{display:flex;align-items:center;gap:14px;padding:10px 12px 2px}
.bar svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.8}
#heart.on{fill:#ff3050;stroke:#ff3050;animation:beat .5s}
@keyframes beat{40%{transform:scale(1.4)}}
.likes{padding:2px 12px;font-weight:600;font-size:14px}
.cap{padding:2px 12px 8px;font-size:14px}
.cap b{margin-right:6px}
.choices{display:flex;gap:12px;align-items:center;justify-content:center;padding:6px 12px 16px;min-height:62px}
.btn{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;white-space:nowrap}
#yes{background:linear-gradient(135deg,#ff7aa2,#ff4d79);color:#fff;box-shadow:0 6px 16px rgba(255,77,121,.4);transition:transform .15s}
#yes:active{transform:scale(.94)}
#no{background:#ece6e8;color:#5a4d52;z-index:80;transition:left .22s cubic-bezier(.3,1.4,.5,1),top .22s cubic-bezier(.3,1.4,.5,1)}
#slot{display:inline-block}

/* ---------- falling snacks ---------- */
.fall{position:fixed;top:-60px;z-index:100;pointer-events:none;animation:fall linear forwards;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--rot,360deg))}}
@media (prefers-reduced-motion:reduce){.bouquet,.hint,.star{animation:none}}
</style>
</head>

  username: "_d.linhh12_",          // tên hiển thị như Instagram
  location: "Hà Nội",               // dòng nhỏ dưới tên (để "" nếu không cần)
  avatar: "images/1.jpg",           // ảnh đại diện nhỏ
  photos: [                         // 5 ảnh của bạn: bỏ vào thư mục images/
    { src: "images/1.jpg", caption: "Nụ cười hôm nay 🌸" },
    { src: "images/2.jpg", caption: "Dịu dàng như hoa 🌷" },
    { src: "images/3.jpg", caption: "Nắng lên rồi ☀️" },
    { src: "images/4.jpg", caption: "Xinh quá trời 💗" },
    { src: "images/5.jpg", caption: "Tặng bạn bó hoa này 💐" }
  ]
};
/* vị trí 5 ảnh trên bó hoa (% theo bó hoa) */
const SPOTS = [[31,19,-6],[69,19,6],[23,39,-4],[77,39,4],[50,45,0]];
/* ==================================== */

const $ = id => document.getElementById(id);
const bouquet = $('bouquet'), overlay = $('overlay');
let current = 0, liked = CONFIG.photos.map(() => false);

/* sao lấp lánh */
for (let i = 0; i < 40; i++) {
  const s = document.createElement('i'); s.className = 'star';
  const z = Math.random() * 3 + 1.5;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
  $('stars').appendChild(s);
}

/* tạo 5 ảnh (ẩn sẵn) */
CONFIG.photos.forEach((p, i) => {
  const [x, y, r] = SPOTS[i];
  const b = document.createElement('button');
  b.className = 'photo'; b.style.cssText = `left:${x}%;top:${y}%;--i:${i};--r:${r}deg`;
  b.setAttribute('aria-label', 'Xem ảnh ' + (i + 1));
  b.innerHTML = '<div class="ph">ảnh ' + (i + 1) + '</div>';
  const img = new Image(); img.alt = ''; img.src = p.src;
  img.onload = () => { b.firstChild.innerHTML = ''; b.firstChild.appendChild(img); };
  b.addEventListener('click', e => { e.stopPropagation(); if (bouquet.classList.contains('open')) openPost(i); });
  bouquet.appendChild(b);
});

function openBouquet() {
  if (bouquet.classList.contains('open')) return;
  bouquet.classList.add('open');
  $('hint').textContent = 'Chạm vào từng bức ảnh nhé 💗';
}
bouquet.addEventListener('click', openBouquet);
bouquet.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openBouquet(); });

/* ---------- bài đăng kiểu Instagram ---------- */
function setImg(el, src, fallbackText) {
  el.innerHTML = fallbackText; const im = new Image(); im.src = src;
  im.onload = () => { el.innerHTML = ''; el.appendChild(im); };
}
function openPost(i) {
  current = i; const p = CONFIG.photos[i];
  $('uname').textContent = $('uname2').textContent = CONFIG.username;
  $('loc').textContent = CONFIG.location;
  $('caption').textContent = p.caption;
  $('avatar').style.backgroundImage = `url("${CONFIG.avatar}")`;
  setImg($('pic'), p.src, 'Thêm ảnh ' + (i + 1) + ' vào thư mục images/');
  renderLike();
  resetNo();
  overlay.classList.add('show');
}
function closePost() { overlay.classList.remove('show'); resetNo(); }
function renderLike() {
  $('heart').classList.toggle('on', liked[current]);
  $('likes').textContent = (liked[current] ? '10k' : '9,9k') + ' lượt thích';
}
$('close').onclick = closePost;
overlay.addEventListener('click', e => { if (e.target === overlay) closePost(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePost(); });

/* ---------- THÍCH NHẮM :> ---------- */
$('yes').addEventListener('click', () => { liked[current] = true; renderLike(); rain(); });
$('heart').addEventListener('dblclick', () => $('yes').click());

function rain() {
  const items = ['🍟', '🧋', '🍿', '🧋', '🥨', '🍘'];
  for (let n = 0; n < 55; n++) {
    setTimeout(() => {
      const s = document.createElement('span'); s.className = 'fall';
      s.textContent = items[Math.floor(Math.random() * items.length)];
      const dur = 2.6 + Math.random() * 2.4;
      s.style.cssText = `left:${Math.random()*96}%;font-size:${24+Math.random()*26}px;animation-duration:${dur}s;--rot:${(Math.random()<.5?-1:1)*(180+Math.random()*540)}deg`;
      document.body.appendChild(s);
      setTimeout(() => s.remove(), dur * 1000 + 100);
    }, n * 55);
  }
}

/* ---------- CHẢ HAY :< (né tay người bấm) ---------- */
const no = $('no'), slot = $('slot');
let ptr = { x: -999, y: -999 }, dodged = false;
const taunts = ['Chả hay :<', 'Hụt rồi nè 😜', 'Không bấm được đâu 🙈', 'Thử lại đi :>', 'Chịu thua chưa? 😝'];
let tauntI = 0;

function resetNo() {
  dodged = false; no.style.position = ''; no.style.left = no.style.top = '';
  slot.style.width = slot.style.height = ''; no.textContent = taunts[0]; tauntI = 0;
}
function dodge() {
  if (!overlay.classList.contains('show')) return;
  const r = no.getBoundingClientRect();
  if (!dodged) {
    slot.style.width = r.width + 'px'; slot.style.height = r.height + 'px';
    no.style.position = 'fixed'; no.style.left = r.left + 'px'; no.style.top = r.top + 'px'; dodged = true;
  }
  const w = no.offsetWidth, h = no.offsetHeight, m = 10;
  let best = null, far = -1;
  for (let t = 0; t < 25; t++) {
    const x = m + Math.random() * (innerWidth - w - 2 * m);
    const y = m + Math.random() * (innerHeight - h - 2 * m);
    const d = Math.hypot(x + w / 2 - ptr.x, y + h / 2 - ptr.y);
    if (d > far) { far = d; best = [x, y]; }
    if (d > 200) break;
  }
  no.style.left = best[0] + 'px'; no.style.top = best[1] + 'px';
  tauntI = (tauntI + 1) % taunts.length; no.textContent = taunts[tauntI];
}
document.addEventListener('pointermove', e => {
  ptr = { x: e.clientX, y: e.clientY };
  if (!overlay.classList.contains('show')) return;
  const r = no.getBoundingClientRect();
  const d = Math.hypot(ptr.x - (r.left + r.width / 2), ptr.y - (r.top + r.height / 2));
  if (d < Math.max(r.width, r.height) * 0.9 + 30) dodge();
});
['pointerdown', 'mouseenter', 'focus'].forEach(ev => no.addEventListener(ev, e => { if (e.clientX !== undefined) ptr = { x: e.clientX, y: e.clientY }; dodge(); }));
no.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; ptr = { x: t.clientX, y: t.clientY }; dodge(); }, { passive: false });
no.addEventListener('click', e => { e.preventDefault(); dodge(); });
</script>
</body>
</html>
